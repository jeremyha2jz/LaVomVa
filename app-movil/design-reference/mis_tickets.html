<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#007d47"><meta name="color-scheme" content="light"><title>Mis tickets | LaVomVa</title>
<!-- Para una PWA 100% offline, aloja Poppins localmente y elimina estos 3 links. -->
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css"></head>
<body>
<div class="app">
<header class="header"><div class="brand">
  <img class="brand-logo" src="assets/lavomva-marca-blanco.png" alt="" width="260" height="199">
  <h1 class="brand-title">LaVomVa</h1>
  <p class="brand-subtitle">Despacho de combustible</p>
</div></header>
<main class="main">
  <div class="content">
    <h2 class="screen-title">Mis tickets</h2>
    <p class="screen-subtitle">Consulta el estado de los tickets de combustible.</p>
    <section class="tickets-list" id="ticketsList"></section>
  </div>
  <svg class="watermark" viewBox="0 0 120 120" fill="none" aria-hidden="true">
  <path d="M25 16h53v88H25z" stroke="currentColor" stroke-width="10" stroke-linejoin="round"/>
  <rect x="34" y="27" width="35" height="26" rx="3" stroke="currentColor" stroke-width="8"/>
  <path d="M78 29h9c10 0 17 8 17 18v30c0 8 5 13 11 13 6 0 10-5 10-11V51" stroke="currentColor" stroke-width="9" stroke-linecap="round"/>
  <path d="M91 32l17 16" stroke="currentColor" stroke-width="9" stroke-linecap="round"/>
</svg>
  <div class="bottom-art" aria-hidden="true"><svg viewBox="0 0 430 145" preserveAspectRatio="none">
  <path class="a1" d="M0 30C88 91 172 121 277 124C325 126 374 116 430 87V145H0Z"/>
  <path class="a2" d="M0 48C91 106 181 133 286 134C340 135 389 123 430 101V145H0Z"/>
  <path class="a3" d="M0 62C94 112 179 136 275 145H0Z"/>
  <path class="a4" d="M264 145C327 136 381 121 430 93V145Z"/>
  <path class="a5" d="M320 145C365 132 401 119 430 103V145Z"/>
</svg></div>
</main>
<div class="nav-wrap"><nav class="nav" aria-label="Navegación principal"><button type="button" class="nav-item" data-route="scan"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M8 21H5a2 2 0 0 1-2-2v-3M16 21h3a2 2 0 0 0 2-2v-3" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"/></svg><span>Escanear</span></button><button type="button" class="nav-item active" aria-current="page" data-route="tickets"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M7 4h10M7 8h10M7 12h7M6 2.8c.8 0 1.2.9 2 .9s1.2-.9 2-.9 1.2.9 2 .9 1.2-.9 2-.9 1.2.9 2 .9 1.2-.9 2-.9V21c-.8 0-1.2-.9-2-.9s-1.2.9-2 .9-1.2-.9-2-.9-1.2.9-2 .9-1.2-.9-2-.9-1.2.9-2 .9V2.8Z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Tickets</span></button><button type="button" class="nav-item" data-route="profile"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="8" r="4" stroke="currentColor" stroke-width="2"/><path d="M4.5 21c.9-4.3 3.5-6.5 7.5-6.5s6.6 2.2 7.5 6.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span>Perfil</span></button></nav></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
</div>
<script src="app.js"></script>
<script>
(() => {
  const api = window.FuelDispatchApp;
  const ICONS = {"tag": "<path d=\"M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linejoin=\"round\"/><path d=\"M7 7h.01\" stroke=\"currentColor\" stroke-width=\"2.8\" stroke-linecap=\"round\"/>", "car": "<path d=\"M5 16v-5l2-5h10l2 5v5M7 16v2M17 16v2M5 12h14M8 12h.01M16 12h.01\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>", "pump": "<path d=\"M7 4h9v16H7zM16 7h2c2 0 3 1 3 3v6\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\"/>", "cal": "<path d=\"M5 6h14v14H5zM8 3v6M16 3v6M5 10h14\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\"/>"};
  const ico = (k, cls) => `<svg${cls ? ` class="${cls}"` : ''} viewBox="0 0 24 24" fill="none" aria-hidden="true">${ICONS[k]}</svg>`;
  const sample = [
    { id: 'COM-2026-000001', status: 'Pendiente', vehicle: 'Toyota Corolla (A829356)', authorized: '20 galones', expires: '30/09/2026' },
    { id: 'COM-2026-000002', status: 'Vencido', vehicle: 'Honda Civic (B736291)', authorized: '15 galones', expires: '15/09/2026' },
    { id: 'COM-2026-000003', status: 'Consumido', vehicle: 'Nissan Sentra (A551243)', authorized: '10 galones', expires: '12/09/2026' },
    { id: 'COM-2026-000004', status: 'Pendiente', vehicle: 'Mitsubishi L200 (C992410)', authorized: '25 galones', expires: '05/10/2026' }
  ];
  const root = document.getElementById('ticketsList');
  const esc = s => String(s ?? '').replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
  const KEY = { Pendiente: 'pending', Vencido: 'expired', Consumido: 'used' };
  const COLOR = { pending: 'var(--state-pending)', expired: 'var(--state-expired)', used: 'var(--state-used)' };

  function render(items = []) {
    root.innerHTML = items.map(t => {
      const key = KEY[t.status] || 'used';
      return `<article class="ticket-card" style="--state:${COLOR[key]}">
        <div class="ticket-top">
          <div class="ticket-id-wrap">${ico('tag')}<div><div class="info-label">ID del ticket</div><div class="ticket-id">${esc(t.id)}</div></div></div>
          <span class="status ${key}">${esc(t.status)}</span>
        </div>
        <div class="ticket-meta">
          <div class="meta-item"><div class="meta-label">${ico('car')}Vehículo</div><div class="meta-value">${esc(t.vehicle)}</div></div>
          <div class="meta-item"><div class="meta-label">${ico('pump')}Autorizado</div><div class="meta-value">${esc(t.authorized)}</div></div>
          <div class="meta-item"><div class="meta-label">${ico('cal')}Vence el</div><div class="meta-value">${esc(t.expires)}</div></div>
        </div>
      </article>`;
    }).join('') || '<div class="card" style="padding:22px;text-align:center;color:var(--muted)">No hay tickets para mostrar.</div>';
  }
  api.renderTickets = render;
  render(sample);
})();
</script>
</body></html>
