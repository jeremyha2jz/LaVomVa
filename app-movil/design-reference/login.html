<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#007d47"><meta name="color-scheme" content="light"><title>Iniciar sesión | LaVomVa</title>
<!-- Para una PWA 100% offline, aloja Poppins localmente y elimina estos 3 links. -->
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css"></head>
<body>
<div class="app app--login">
<header class="header"><div class="brand">
  <img class="brand-logo" src="assets/lavomva-marca-blanco.png" alt="" width="260" height="199">
  <h1 class="brand-title">LaVomVa</h1>
  <p class="brand-subtitle">Despacho de combustible</p>
</div></header>
<main class="main">
  <div class="content">
    <h2 class="screen-title">Iniciar sesión</h2>
    <p class="screen-subtitle">Ingresa tus credenciales de despachador</p>

    <form class="login-form" id="loginForm" novalidate>
      <label class="login-field" for="username">
        <span class="lf-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="7" r="4"/><path d="M4.5 21a7.5 7.5 0 0 1 15 0"/></svg></span>
        <span class="lf-body"><span class="lf-label">Usuario</span>
          <input id="username" name="username" type="text" autocomplete="username" placeholder="despachador1" required></span>
      </label>
      <label class="login-field" for="password">
        <span class="lf-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/><circle cx="12" cy="15" r="1" fill="currentColor" stroke="none"/><path d="M12 16v2"/></svg></span>
        <span class="lf-body"><span class="lf-label">Contraseña</span>
          <input id="password" name="password" type="password" autocomplete="current-password" placeholder="••••••" required></span>
        <button class="password-toggle" id="passwordToggle" type="button" aria-label="Mostrar contraseña" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 12s3.4-6 9.5-6 9.5 6 9.5 6-3.4 6-9.5 6S2.5 12 2.5 12Z"/><circle cx="12" cy="12" r="2.7"/></svg></button>
      </label>
      <button class="login-button" id="loginButton" type="submit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 17l5-5-5-5"/><path d="M15 12H3"/><path d="M14 3h5a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-5"/></svg><span>Entrar</span></button>
    </form>

    <div class="error-message" id="loginError" role="alert" aria-live="polite"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v6"/><path d="M12 17h.01"/></svg><span id="loginErrorText">Usuario o contraseña incorrectos</span></div>

    <div class="internal-note">
      <div class="divider"><span class="shield" aria-hidden="true"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2 4.8 5.4v5.1c0 4.7 3 8.9 7.2 10.5 4.2-1.6 7.2-5.8 7.2-10.5V5.4L12 2Zm2.7 11.7h-5.4V10h.8V8.8a1.9 1.9 0 1 1 3.8 0V10h.8v3.7Zm-3-3.7h.6V8.8a.3.3 0 0 0-.6 0V10Z"/></svg></span></div>
      <p>Uso interno — Acceso restringido a despachadores</p>
    </div>
  </div>
  <svg class="watermark" viewBox="0 0 120 120" fill="none" aria-hidden="true">
  <path d="M25 16h53v88H25z" stroke="currentColor" stroke-width="10" stroke-linejoin="round"/>
  <rect x="34" y="27" width="35" height="26" rx="3" stroke="currentColor" stroke-width="8"/>
  <path d="M78 29h9c10 0 17 8 17 18v30c0 8 5 13 11 13 6 0 10-5 10-11V51" stroke="currentColor" stroke-width="9" stroke-linecap="round"/>
  <path d="M91 32l17 16" stroke="currentColor" stroke-width="9" stroke-linecap="round"/>
</svg>
  <div class="bottom-art" aria-hidden="true"></div>
</main>
</div>
<script src="app.js"></script>
<script>
(() => {
  const form = document.getElementById('loginForm');
  const username = document.getElementById('username');
  const password = document.getElementById('password');
  const toggle = document.getElementById('passwordToggle');
  const button = document.getElementById('loginButton');
  const error = document.getElementById('loginError');
  const errorText = document.getElementById('loginErrorText');

  const showError = (m = 'Usuario o contraseña incorrectos') => { errorText.textContent = m; error.classList.add('is-visible'); };
  const clearError = () => error.classList.remove('is-visible');
  const setLoading = (on) => { button.disabled = on; button.setAttribute('aria-busy', String(on)); };

  toggle.addEventListener('click', () => {
    const hidden = password.type === 'password';
    password.type = hidden ? 'text' : 'password';
    toggle.setAttribute('aria-pressed', String(hidden));
    toggle.setAttribute('aria-label', hidden ? 'Ocultar contraseña' : 'Mostrar contraseña');
    password.focus({ preventScroll: true });
  });
  username.addEventListener('input', clearError);
  password.addEventListener('input', clearError);

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    clearError();
    const credentials = { username: username.value.trim(), password: password.value };
    if (!credentials.username || !credentials.password) {
      showError('Completa el usuario y la contraseña');
      (!credentials.username ? username : password).focus();
      return;
    }
    setLoading(true);
    try {
      // Punto de integración: define window.FuelTicketLogin.onSubmit desde tu app.
      if (window.FuelTicketLogin && typeof window.FuelTicketLogin.onSubmit === 'function') {
        const r = await window.FuelTicketLogin.onSubmit(credentials);
        if (r && r.ok === false) showError(r.message);
        return;
      }
      window.dispatchEvent(new CustomEvent('fuel:login-submit', { detail: credentials }));
      // Demo de esta vista previa: despachador1 / 1234
      if (credentials.username === 'despachador1' && credentials.password === '1234') location.href = 'escanear_ticket.html';
      else showError();
    } catch (err) {
      console.error(err);
      showError('No fue posible iniciar sesión. Intenta nuevamente.');
    } finally { setLoading(false); }
  });

  window.FuelTicketLogin = window.FuelTicketLogin || {};
  Object.assign(window.FuelTicketLogin, { showError, clearError, setLoading });
})();
</script>
</body></html>
